gp:
  num_individuals: 1
  generations: 5
  multi_island:
    num_islands: 1
    migration: { "freq": 10, "frac": 0.05 }
  variation_mechanism: varOr
  crossover_prob: 0.2
  mut_prob: 0.8
  frac_elitist: 0.
  min_: 1
  max_: 3
  overlapping_generation: True
  validate: False
  penalty: { "method": "length", "reg_param": 1.e-4 }
  select:
    fun: tools.selection.selStochasticUniversalSampling
    kargs: "{'k': self.num_individuals}"
  mutate:
    fun: gp.mixedMutate
    kargs: "{'expr': toolbox.expr_mut, 'pset': pset, 'prob': [0.7, 0.2, 0.1]}"
    expr_mut: gp.genHalfAndHalf
    expr_mut_kargs: "{'min_': 1, 'max_': 2, 'max_length': 20}"
  crossover:
    fun: gp.cxOnePoint
    kargs: "{}"
  immigration: { "enabled": False, "freq": 10, "frac": 0.9 }
  batch_size: 5
  num_cpus: 1
  use_constants: True
  remove_init_duplicates: False
  primitives:
    imports: {
      "flex.gp.cochain_primitives": ["coch_primitives"],
      "flex.gp.jax_primitives": ["jax_primitives"],
    }
    used: [
      { "name": "AddF", "dimension": null, "rank": null },
      { "name": "SubF", "dimension": null, "rank": null },
      { "name": "MulF", "dimension": null, "rank": null },
      { "name": "Div", "dimension": null, "rank": null },
      # { "name": "SquareF", "dimension": null, "rank": null },
      # { "name": "SqrtF", "dimension": null, "rank": null },
      # { "name": "ExpF", "dimension": null, "rank": null },
      { "name": "AddC", "dimension": [!dim 0, !dim 1], "rank": [!rank SC] },
      { "name": "SubC", "dimension": [!dim 0, !dim 1], "rank": [!rank SC] },
      { "name": "Square", "dimension": [!dim 0, !dim 1], "rank": [!rank SC] },
      # { "name": "Sqrt", "dimension": [!dim 0, !dim 1], "rank": [!rank SC] },
      { "name": "MF", "dimension": [!dim 0, !dim 1], "rank": [!rank SC] },
      { "name": "Exp", "dimension": [!dim 0, !dim 1], "rank": [!rank SC] },
      { "name": "CMul", "dimension": [!dim 0, !dim 1], "rank": [!rank SC] },
      { "name": "cob", "dimension": [!dim 0], "rank": [!rank SC] },
      { "name": "del", "dimension": [!dim 1], "rank": [!rank SC] },
      { "name": "St1", "dimension": [!dim 0, !dim 1], "rank": [!rank SC] },
    ]

ray:
  num_cpus: 1
  object_store_memory_mb: 256
  include_working_dir: True
  local_mode: False

fitness:
  fitness_scale: 1.0
  max_tree_length: 40
  constant_bounds: [-1.0, 1.0]
  pso_generations: 10
  pso_swarm_size: 10

dynamic_pde:
  dataset_path: data/Fx_dataset.csv
  parameterization: 1
  excitation: var2
  run: 5
  n_x: 15
  sigma_0: 0.12
  omega: 31.41592653589793
  amplitude_ratio: 0.4
  train_fraction: 0.7
  val_fraction: 0.15
  max_time_points: 101
  time_stride: 1
  solver_max_dt: 0.001
  force_scale: auto
  clear_jax_caches: True
  params:
    L: 0.082
    k_0: 732.0
    Fz: 3000.0
    w: 4.5e5
    mu_s: 1.3
    mu_d: 0.84
    v_S: 5.24
    delta_S: 0.86
    V: 16.0
